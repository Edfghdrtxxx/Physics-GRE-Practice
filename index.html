<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Physics GRE · Prep Studio</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>&#936;</text></svg>">
  <!-- Every asset URL carries a ?v= cache-buster, including the three scripts
       injected at runtime (js/view-formulas.js -> flashmodes.js,
       formula-search.js; js/view-search.js -> search.js). Tokens are per file:
       when you change a file, bump the token on ITS tag (or inject site) so a
       returning browser never mixes a fresh view with a stale engine. -->
  <link rel="stylesheet" href="css/fonts.css?v=20260918b">
  <link rel="stylesheet" href="css/style.css?v=20260922b">
  <link rel="stylesheet" href="css/visualizer.css?v=20260916f">
  <link rel="stylesheet" href="css/print.css?v=20260916f">
  <link rel="stylesheet" href="css/motion.css?v=20260922b">
  <link rel="stylesheet" href="css/concepts.css?v=20260916f">
  <link rel="stylesheet" href="vendor/katex/katex.min.css?v=20260916f">
</head>
<body>
  <!-- Keyboard bypass (WCAG 2.4.1): visually hidden until focused; see
       .skip-link in css/style.css. #main carries tabindex="-1" so the
       target is focusable. The href is kept for semantics, but activation is
       intercepted in PGRE.boot (js/app.js): preventDefault + focus(#main), so
       "#main" never reaches the hash router (it would remount the dashboard). -->
  <a class="skip-link" href="#main">Skip to content</a>
  <aside id="sidebar">
    <a class="brand" id="brand-home" href="#/" aria-label="Physics GRE home">
      <div class="brand-name">Physics <span class="accent">GRE</span></div>
      <div class="brand-sub">Prep Studio · exam Nov 1, 2026</div>
    </a>
    <nav id="sidebar-nav"></nav>
    <div id="sidebar-footer">
      <button id="theme-toggle" class="btn btn-ghost btn-sm" type="button" aria-pressed="false">Dark mode</button>
    </div>
  </aside>

  <main id="main" tabindex="-1">
    <div id="topbar">
      <div class="topbar-inner">
        <button id="sidebar-toggle" class="topbar-arrow" type="button"
                aria-expanded="true" aria-controls="sidebar"
                aria-label="Hide sidebar" title="Hide sidebar">&#9776;</button>
        <div class="topbar-arrows">
          <button id="topbar-back" class="topbar-arrow" type="button"
                  aria-label="Go back" title="Back">&#9664;</button>
          <button id="topbar-fwd" class="topbar-arrow" type="button"
                  aria-label="Go forward" title="Forward">&#9654;</button>
        </div>
        <nav id="breadcrumbs" class="breadcrumbs" aria-label="Breadcrumb"></nav>
        <span id="origin-line" class="origin-line" title="Progress is stored separately for each browser origin"></span>
        <!-- focus timer quick control — lives in the top bar (not the sidebar)
             so folding the sidebar never hides it -->
        <div id="focus-timer" class="focus-timer">
          <div class="focus-row">
            <a class="today-learn" id="today-learn" href="#/study-time"
               title="Active time today">
              <span class="today-learn-run">
                <span class="today-learn-kicker">Today</span>
                <span id="today-learn-time" class="today-learn-time">0 min 0 s</span>
              </span>
            </a>
            <button id="focus-toggle" class="focus-toggle" type="button"
                    aria-pressed="false" aria-label="Start focus timer"
                    title="Times reading &amp; derivations you do away from the app.">
              <span class="focus-dot" aria-hidden="true"></span>
              <span id="focus-label" class="focus-label">Start focus</span>
            </button>
            <div class="focus-mode">
              <button id="focus-open" class="focus-open" type="button"
                      aria-expanded="false" aria-controls="focus-mode-panel"
                      aria-label="Timing — choose countdown or timing"
                      title="Choose countdown or timing">
                <span id="focus-time" class="focus-time">0:00</span>
                <span class="focus-open-ico" aria-hidden="true"></span>
              </button>
              <div id="focus-mode-panel" class="focus-mode-panel" hidden>
                <div class="focus-mode-row" role="group" aria-label="Focus mode">
                  <button type="button" class="focus-chip" data-fmode="timing"
                          aria-pressed="true">Timing</button>
                  <button type="button" class="focus-chip" data-fmode="countdown"
                          aria-pressed="false">Countdown</button>
                </div>
                <div class="focus-mode-goals" id="focus-mode-goals" hidden>
                  <button type="button" class="focus-chip" data-fgoal="25">25 min</button>
                  <button type="button" class="focus-chip" data-fgoal="50">50 min</button>
                  <span class="focus-chip focus-chip-custom">
                    <input id="focus-mode-custom" class="focus-custom-in" type="number"
                           min="1" max="240" inputmode="numeric" placeholder="min"
                           aria-label="Custom minutes">
                  </span>
                </div>
                <a class="focus-mode-page" href="#/focus">Open focus page</a>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
    <div id="view"></div>
  </main>

  <div id="toasts"></div>

  <!-- Every script below is `defer`: the browser fetches them in parallel while
       it parses the page, then runs them in DOCUMENT ORDER (defer keeps order
       for classic scripts) once the markup is complete and before
       DOMContentLoaded. Load order is therefore still a contract:
       marked -> katex -> auto-render, data before engine before views, and
       app.js before motion.js. js/app.js boots on DOMContentLoaded, which
       fires only after the last deferred script (motion.js) has run, so
       PGRE.motion and window.renderMathInElement always exist by then.
       auto-render.min.js depends on the katex global from the line above. -->
  <script src="vendor/marked.min.js?v=20260916f" defer></script>
  <script src="vendor/katex/katex.min.js?v=20260916f" defer></script>
  <script src="vendor/katex/contrib/auto-render.min.js?v=20260916f" defer></script>

  <!-- data -->
  <script src="js/data-topics.js?v=20260916f" defer></script>
  <script src="js/data-questions.js?v=20260916f" defer></script>
  <script src="js/data-formulas.js?v=20260921b" defer></script>
  <script src="js/data-achievements.js?v=20260916f" defer></script>
  <script src="js/data-plan.js?v=20260916f" defer></script>
  <script src="js/data-packs.js?v=20260916f" defer></script>
  <script src="js/plan-engine.js?v=20260918a" defer></script>

  <!-- book-derived bank (gitignored; generated placeholders until the
       extraction pipeline fills them) -->
  <script src="content/bank/cpg-questions.js?v=20260916f" defer></script>
  <script src="content/bank/cpg-exams.js?v=20260916f" defer></script>
  <script src="content/bank/cpg-formulas.js?v=20260916f" defer></script>
  <script src="content/bank/ets-exams.js?v=20260916f" defer></script>  <!-- released ETS exams (gitignored — ETS copyright) -->

  <!-- engine -->
  <script src="js/store.js?v=20260921a" defer></script>
  <script src="js/srs.js?v=20260918c" defer></script>
  <script src="js/bank.js?v=20260918b" defer></script>
  <script src="js/packs.js?v=20260919a" defer></script>
  <script src="js/study-time.js?v=20260916f" defer></script>
  <script src="js/timer.js?v=20260921a" defer></script>
  <script src="js/focus-sound.js?v=20260916f" defer></script>  <!-- focus-timer selectable SFX -->
  <script src="js/focus-fx.js?v=20260916f" defer></script>  <!-- detector field + beamline fx for the focus page -->
  <script src="js/notes.js?v=20260916f" defer></script>
  <script src="js/gamify.js?v=20260918c" defer></script>
  <script src="js/formula-checkin.js?v=20260916f" defer></script>  <!-- formula-recall daily check-in -->
  <script src="js/chart-tip.js?v=20260916f" defer></script>  <!-- delegated [data-tip] chart popover -->

  <script src="js/view-dashboard.js?v=20260920c" defer></script>
  <script src="js/view-topic.js?v=20260916f" defer></script>
  <script src="js/view-practice.js?v=20260921b" defer></script>
  <script src="js/view-history.js?v=20260916f" defer></script>
  <script src="js/view-analytics.js?v=20260916f" defer></script>
  <script src="js/view-build.js?v=20260919a" defer></script>
  <script src="js/view-search.js?v=20260918b" defer></script>
  <script src="js/view-notes.js?v=20260916f" defer></script>
  <script src="js/view-mistakes.js?v=20260920e" defer></script>
  <script src="js/view-formulas.js?v=20260919a" defer></script>
  <script src="js/view-focus.js?v=20260921a" defer></script>        <!-- F5 focus page -->
  <script src="js/view-study-time.js?v=20260917i" defer></script>   <!-- dedicated study-time page -->
  <script src="js/view-achievements.js?v=20260916f" defer></script>
  <script src="js/view-plan.js?v=20260918a" defer></script>
  <script src="js/exam-engine.js?v=20260919a" defer></script>
  <script src="js/view-exam.js?v=20260919a" defer></script>
  <script src="js/visualizer-engine.js?v=20260916f" defer></script>
  <script src="js/visualizers/trio-g1.js?v=20260916f" defer></script>
  <script src="js/visualizers/trio-g2.js?v=20260916f" defer></script>
  <script src="js/visualizers/trio-g3.js?v=20260916f" defer></script>
  <script src="js/visualizers/trio-g4.js?v=20260916f" defer></script>
  <script src="js/visualizers/trio-g5.js?v=20260916f" defer></script>
  <script src="js/visualizers/trio-g6.js?v=20260916f" defer></script>
  <script src="js/visualizers/trio-g7.js?v=20260916f" defer></script>
  <script src="js/visualizers/trio-g8.js?v=20260916f" defer></script>
  <script src="js/visualizers/trio-g9.js?v=20260916f" defer></script>
  <script src="js/visualizers/trio-g10.js?v=20260916f" defer></script>
  <script src="js/concept-search.js?v=20260920a" defer></script>
  <script src="js/concept-door-fx.js?v=20260916f" defer></script>
  <script src="js/visualizers/spherical.js?v=20260920a" defer></script>
  <script src="js/visualizers/azimuth.js?v=20260920a" defer></script>
  <script src="js/view-concepts.js?v=20260920a" defer></script>

  <!-- shell -->
  <script src="js/sidebar-icons.js?v=20260921a" defer></script>
  <script src="js/app.js?v=20260921a" defer></script>
  <!-- motion effects: runs after app.js and before DOMContentLoaded, so PGRE.motion exists before PGRE.boot runs -->
  <script src="js/motion.js?v=20260916f" defer></script>
</body>
</html>
